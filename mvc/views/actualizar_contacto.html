$def with (contacto)

<h2>Actualizar Contacto</h2>

<form name="actualizar_contacto" method="POST">
    <label for="nombre">Nombre</label><br>
    <input type="text" name="nombre" id="nombre" value="$contacto[0]['nombre']"><br>

    <label for="email">Email</label><br>
    <input type="email" name="email" id="email" value="$contacto[0]['email']"><br>

    <label for="telefono">Teléfono</label><br>
    <input type="tel" name="telefono" id="telefono" value="$contacto[0]['telefono']"><br>

    <button type="submit">Guardar</button>
    <a href="/contactos">Cancelar</a>
</form>
